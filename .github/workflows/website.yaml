name: website

# Guardrails for docs.vorpal.build: size budgets, accessibility (axe), links
# and anchors (lychee), and Lighthouse lab metrics. The site is built
# directly with Bun here, so these checks don't wait for the Vorpal artifact
# builds in vorpal.yaml. The tooling lives in script/website-checks, outside
# website/, so the vorpal-website artifact's sources and install are unchanged.

on:
  pull_request:
    paths:
      - ".github/workflows/website.yaml"
      - "script/website-checks/**"
      - "website/**"

concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}

permissions:
  contents: read

env:
  ASTRO_TELEMETRY_DISABLED: "1"
  # Same Bun as the vorpal-website artifact (DEFAULT_BUN_VERSION in the SDKs).
  BUN_VERSION: "1.4.4"
  CI: "true"
  NODE_VERSION: "24"

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Build website
        id: build
        working-directory: website
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: Install check tools
        working-directory: script/website-checks
        run: |
          bun install --frozen-lockfile
          node_modules/.bin/playwright install --with-deps chromium

      - name: Size budgets
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        working-directory: script/website-checks
        run: node size.mjs

      - name: Links and anchors
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: lycheeverse/lychee-action@v2
        with:
          lycheeVersion: v0.24.2
          # Internal links and #fragments only. External links are checked by
          # test-website-docs in vorpal.yaml.
          args: >-
            --offline
            --include-fragments
            --index-files index.html
            --root-dir ${{ github.workspace }}/website/dist
            --exclude-path ${{ github.workspace }}/website/dist/pagefind
            --no-progress
            ${{ github.workspace }}/website/dist

      - name: Accessibility (axe)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        working-directory: script/website-checks
        run: node a11y.mjs

  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Build website
        working-directory: website
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: Install check tools
        working-directory: script/website-checks
        run: bun install --frozen-lockfile

      - name: Lighthouse CI
        working-directory: script/website-checks
        run: node_modules/.bin/lhci autorun --config=lighthouserc.json

      - name: Lighthouse summary
        if: ${{ !cancelled() && hashFiles('script/website-checks/.lighthouseci/reports/manifest.json') != '' }}
        working-directory: script/website-checks
        run: node lighthouse-summary.mjs

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: lighthouse-reports
          path: script/website-checks/.lighthouseci/reports
          retention-days: 14
          include-hidden-files: true
